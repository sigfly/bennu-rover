name: Build offline rover
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: standard
            texture: '8192'
          - edition: ultra
            texture: '16384'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install Pillow==11.3.0
      - run: npm test
      - run: node tools/bundle.mjs
      - name: Assemble standalone HTML
        env:
          EDITION: ${{ matrix.edition }}
          TEXTURE: ${{ matrix.texture }}
        run: python tools/build.py --edition "$EDITION" --texture "$TEXTURE"
      - uses: actions/upload-artifact@v4
        with:
          name: bennu-rover-${{ matrix.edition }}-${{ matrix.texture }}
          path: dist/index.html
          compression-level: 1
      - name: Install browser
        if: ${{ matrix.edition != 'ultra' }}
        run: npx playwright install --with-deps chromium
      - name: Offline browser smoke test
        if: ${{ matrix.edition != 'ultra' }}
        run: node tools/smoke.mjs
