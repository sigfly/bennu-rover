name: Deploy Bennu Rover to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'package*.json'
      - 'landmark-manifest.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install Pillow==11.3.0
      - run: npm test
      - run: npm run build
      - name: Test all embedded architectural assets
        run: node --test tools/landmarks.test.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the standalone rover
        id: deployment
        uses: actions/deploy-pages@v4
